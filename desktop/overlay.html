<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: transparent;
      overflow: hidden;
      user-select: none;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 360px;
      height: 88px;
      padding: 0 28px;
      -webkit-app-region: drag;
      background: rgba(20, 20, 22, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4),
        0 0 0 0.5px rgba(255, 255, 255, 0.05) inset;
      opacity: 0;
      transform: scale(0.96) translateY(4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .container.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .indicator {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }

    .indicator.recording {
      background: #ef4444;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .indicator.transcribing {
      background: #f59e0b;
      animation: spin-dot 1s linear infinite;
    }

    .indicator.creating {
      background: #3b82f6;
      animation: spin-dot 1s linear infinite;
    }

    .indicator.done {
      background: #22c55e;
    }

    .indicator.error {
      background: #ef4444;
    }

    .indicator.save-failed {
      background: #f59e0b;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    @keyframes spin-dot {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .label {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .cancel-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.5);
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
      -webkit-app-region: no-drag;
    }

    .cancel-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.8);
    }

    .cancel-btn.visible {
      display: flex;
    }

    .retry-actions {
      display: none;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .retry-actions.visible {
      display: flex;
    }

    .retry-btn, .dismiss-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      padding: 0 12px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      -webkit-app-region: no-drag;
    }

    .retry-btn {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.9);
    }

    .retry-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .dismiss-btn {
      background: transparent;
      color: rgba(255, 255, 255, 0.4);
    }

    .dismiss-btn:hover {
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <div class="container" id="container">
    <div class="indicator" id="indicator"></div>
    <span class="label" id="label"></span>
    <button class="cancel-btn" id="cancelBtn" title="Cancel recording (Esc)">✕</button>
    <div class="retry-actions" id="retryActions">
      <button class="retry-btn" id="retryBtn">Retry</button>
      <button class="dismiss-btn" id="dismissBtn">✕</button>
    </div>
  </div>

  <script>
    const container = document.getElementById("container");
    const indicator = document.getElementById("indicator");
    const label = document.getElementById("label");
    const cancelBtn = document.getElementById("cancelBtn");
    const retryActions = document.getElementById("retryActions");
    const retryBtn = document.getElementById("retryBtn");
    const dismissBtn = document.getElementById("dismissBtn");

    window.electronAPI.onStateChange(({ state, text }) => {
      indicator.className = "indicator " + state;
      label.textContent = text;

      // Show cancel button only during recording
      cancelBtn.classList.toggle("visible", state === "recording");
      // Show retry actions only on save failure
      retryActions.classList.toggle("visible", state === "save-failed");

      // Show with animation
      requestAnimationFrame(() => {
        container.classList.add("visible");
      });
    });

    cancelBtn.addEventListener("click", () => {
      window.electronAPI.cancelRecording();
    });

    retryBtn.addEventListener("click", () => {
      window.electronAPI.retrySave();
    });

    dismissBtn.addEventListener("click", () => {
      window.electronAPI.dismissSave();
    });

    // Reset visual state when overlay is hidden so stale content doesn't flash on next show
    window.electronAPI.onHide(() => {
      container.classList.remove("visible");
      indicator.className = "indicator";
      label.textContent = "";
      cancelBtn.classList.remove("visible");
      retryActions.classList.remove("visible");
    });
  </script>
</body>
</html>
